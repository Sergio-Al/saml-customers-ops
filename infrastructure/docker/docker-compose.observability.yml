name: ai-ops-observability

# Opt-in observability stack — heavy. Start with:
#   pnpm infra:observability:up
#
# Phase 7 wires services to export OTLP traces/metrics/logs here.

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: ai-ops-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  loki:
    image: grafana/loki:latest
    container_name: ai-ops-loki
    restart: unless-stopped
    ports:
      - "${LOKI_PORT:-3100}:3100"
    command: -config.file=/etc/loki/local-config.yaml

  tempo:
    image: grafana/tempo:latest
    container_name: ai-ops-tempo
    restart: unless-stopped
    ports:
      - "${TEMPO_OTLP_PORT:-4318}:4318" # OTLP HTTP
      - "${TEMPO_QUERY_PORT:-3200}:3200" # Tempo query API
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  grafana:
    image: grafana/grafana:latest
    container_name: ai-ops-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    depends_on:
      - prometheus
      - loki
      - tempo
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  tempo-data:
  grafana-data:
